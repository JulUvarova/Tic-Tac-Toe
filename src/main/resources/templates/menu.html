<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Меню</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<button class="profile-btn" title="Мой профиль" onclick="goToMyProfile()">
    <span class="profile-icon">👤</span>
</button>
<div class="container">
    <h2>Меню</h2>
    <button onclick="startGame('COMPUTER')">Новая игра: компьютер</button>
    <button onclick="startGame('USER')">Новая игра: пользователь</button>
    <button onclick="window.location.href='/ui/join'">Присоединиться</button>
    <button onclick="window.location.href='/ui/user'">Список пользователей</button>
    <button onclick="window.location.href='/ui/leaderboard'">Таблица лидеров</button>
</div>
<script src="/js/auth.js"></script>
<script>
    function startGame(opponent) {
        authFetch('/game?opponent=' + opponent, {method: 'POST'})
            .then(res => res.ok ? res.json() : Promise.reject())
            .then(game => window.location.href = '/ui/game/' + game.id)
            .catch(() => alert('Ошибка создания игры'));
    }

    // Проверяем авторизацию при загрузке страницы
    checkAuth();
</script>
</body>
</html>
