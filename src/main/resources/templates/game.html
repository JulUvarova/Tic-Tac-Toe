<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Игра № [[${gameId}]]</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="profile-container">
    <button class="profile-btn" title="Профиль" onclick="toggleProfileMenu()">
        <span class="profile-icon">👤</span>
    </button>
    <div id="profile-menu" class="profile-menu">
        <button class="profile-menu-item" onclick="goToMyProfile(); closeProfileMenu();">
            👤 Мой профиль
        </button>
        <button class="profile-menu-item logout" onclick="logout();">
            🚪 Выйти
        </button>
    </div>
</div>
<div class="container">
    <h2>Игра № <span id="gameId">[[${gameId}]]</span></h2>

    <div id="playersInfo" class="player-info-container"></div>

    <div id="errorBox" class="error-box"></div>

    <div id="board" class="board"></div>

    <button onclick="window.location.href='/ui/menu'">В меню</button>
</div>
<script src="/js/auth.js"></script>
<script>
    const gameId = document.getElementById('gameId').textContent;
    let boardModel = null;
    let isGameOver = false;
    let playerX = null;
    let playerO = null;
    let currentPlayer = null;
    let playerXLogin = null;
    let playerOLogin = null;
    let currentPlayerLogin = null;
    let gameStatus = null;

    async function fetchGame() {
        const res = await authFetch(`/game/${gameId}`);
        if (res.ok) {
            const game = await res.json();
            boardModel = game.board;
            playerX = game.playerX;
            playerO = game.playerO;
            currentPlayer = game.currentPlayer;
            gameStatus = game.status;
            // Получаем логины
            if (!playerOLogin) {
                playerOLogin = await fetchUserLogin(playerO);
            }
            if (!playerXLogin) {
                playerXLogin = await fetchUserLogin(playerX);
            }
            currentPlayerLogin = await fetchUserLogin(currentPlayer);
            renderPlayersInfo();
            renderBoard();
            checkGameOver();
        } else {
            showError('Ошибка загрузки игры');
        }
    }

    async function fetchUserLogin(uuid) {
        if (!uuid) return null;
        try {
            const res = await authFetch(`/user/${uuid}`);
            if (res.ok) {
                const user = await res.json();
                return user.login;
            }
        } catch (e) {
        }
        return uuid;
    }

    function renderPlayersInfo() {
        const infoDiv = document.getElementById('playersInfo');
        let x = playerXLogin ? playerXLogin : '—';
        let o = playerOLogin ? playerOLogin : '—';
        let cur = currentPlayerLogin ? currentPlayerLogin : '—';

        infoDiv.innerHTML = `
                <div class="player-info">X: ${x}</div>
                <div class="player-info">O: ${o}</div>
                <div class="player-info">Ход игрока: ${cur}</div>
            `;
    }

    function renderBoard() {
        const boardDiv = document.getElementById('board');
        boardDiv.innerHTML = '';
        for (let i = 0; i < 3; i++) {
            for (let j = 0; j < 3; j++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                const val = boardModel[i][j];
                if (val === 1) cell.textContent = 'X';
                else if (val === 2) cell.textContent = 'O';
                else cell.textContent = '';
                if (val === 0 && !isGameOver) {
                    cell.addEventListener('click', () => makeMove(i, j));
                } else {
                    cell.classList.add('disabled');
                }
                boardDiv.appendChild(cell);
            }
        }
    }

    async function makeMove(i, j) {
        if (isGameOver) return;
        const newBoard = boardModel.map(row => row.slice());
        if (newBoard[i][j] !== 0) return;
        let value = null;
        if (currentPlayer === playerX) value = 1;
        else if (currentPlayer === playerO) value = 2;
        newBoard[i][j] = value;
        const moveReq = {id: gameId, board: newBoard};
        try {
            const res = await authFetch(`/game/${gameId}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(moveReq)
            });
            if (res.ok) {
                const game = await res.json();
                boardModel = game.board;
                playerX = game.playerX;
                playerO = game.playerO;
                currentPlayer = game.currentPlayer;
                gameStatus = game.status;
                currentPlayerLogin = await fetchUserLogin(currentPlayer);
                renderPlayersInfo();
                renderBoard();
                hideError();
                checkGameOver();
            } else {
                const err = await res.json();
                showError(err.error || 'Ошибка хода');
            }
        } catch (e) {
            showError('Ошибка соединения');
        }
    }

    function showError(msg) {
        const box = document.getElementById('errorBox');
        box.textContent = msg;
        box.style.display = 'block';
    }

    function hideError() {
        const box = document.getElementById('errorBox');
        box.style.display = 'none';
    }

    function checkGameOver() {
        if (!gameStatus) return;
        if (gameStatus === 'X_WINS') {
            showError('Победа X!');
            stopPolling();
            isGameOver = true;
            return;
        }
        if (gameStatus === 'O_WINS') {
            showError('Победа O!');
            stopPolling();
            isGameOver = true;
            return;
        }
        if (gameStatus === 'DRAW') {
            showError('Ничья!');
            stopPolling();
            isGameOver = true;
            return;
        }
    }

    let pollingInterval = null;

    function startPolling() {
        if (pollingInterval) clearInterval(pollingInterval);
        pollingInterval = setInterval(fetchGame, 1000); // каждую сек
    }

    function stopPolling() {
        if (pollingInterval) clearInterval(pollingInterval);
    }

    // Проверяем авторизацию при загрузке страницы
    checkAuth();
    fetchGame();
    startPolling();
    
    // Инициализируем обработчик закрытия меню профиля
    initProfileMenuHandler();
</script>
</body>
</html>
