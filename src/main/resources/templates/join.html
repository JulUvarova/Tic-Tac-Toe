<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Присоединиться к игре</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h2>Доступные игры</h2>
    <div id="games" class="games-container"></div>
    <button onclick="window.location.href='/ui/menu'">В меню</button>
</div>
<script>
    function authFetch(url, options = {}) {
        const login = sessionStorage.getItem('authLogin');
        const password = sessionStorage.getItem('authPassword');
        if (!login || !password) {
            window.location.href = '/ui/auth';
            return Promise.reject('Нет авторизации');
        }
        const credentials = btoa(login + ':' + password);
        options.headers = options.headers || {};
        options.headers['Authorization'] = 'Basic ' + credentials;
        return fetch(url, options);
    }

    function loadGames() {
        authFetch('/game')
            .then(res => res.ok ? res.json() : Promise.reject())
            .then(games => {
                const gamesContainer = document.getElementById('games');
                gamesContainer.innerHTML = '';

                if (games.length === 0) {
                    const noGames = document.createElement('div');
                    noGames.className = 'no-games';
                    noGames.textContent = 'Нет доступных игр';
                    gamesContainer.appendChild(noGames);
                } else {
                    games.forEach(game => {
                        const gameItem = document.createElement('div');
                        gameItem.className = 'game-item';
                        gameItem.textContent = `Игра №${game.id}`;
                        gameItem.onclick = () => joinGame(game.id);
                        gamesContainer.appendChild(gameItem);
                    });
                }
            })
            .catch(() => alert('Ошибка загрузки игр'));
    }

    function joinGame(gameId) {
        authFetch('/game/' + gameId + '/join', {method: 'POST'})
            .then(res => res.ok ? res.json() : Promise.reject())
            .then(game => window.location.href = '/ui/game/' + game.id)
            .catch(() => alert('Ошибка присоединения к игре'));
    }

    loadGames();
    setInterval(loadGames, 5000);

</script>
</body>
</html>
