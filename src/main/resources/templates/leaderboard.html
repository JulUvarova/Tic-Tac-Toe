<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Таблица лидеров</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<button class="profile-btn" title="Мой профиль" onclick="goToMyProfile()">
    <span class="profile-icon">👤</span>
</button>
<div class="container">
    <h2>Таблица лидеров</h2>
    <div id="leaderboard" class="games-container"></div>
    <button onclick="window.location.href='/ui/menu'">В меню</button>
</div>
<script>
    function authFetch(url, options = {}) {
        const login = sessionStorage.getItem('authLogin');
        const password = sessionStorage.getItem('authPassword');
        if (!login || !password) {
            window.location.href = '/ui/auth';
            return Promise.reject('Нет авторизации');
        }
        const credentials = btoa(login + ':' + password);
        options.headers = options.headers || {};
        options.headers['Authorization'] = 'Basic ' + credentials;
        return fetch(url, options);
    }

    function loadLeaderboard() {
        authFetch('/game/leaderboard')
            .then(res => res.ok ? res.json() : Promise.reject())
            .then(async data => {
                const container = document.getElementById('leaderboard');
                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="no-games">Нет данных для отображения</div>';
                    return;
                }
                const loginMap = {};
                await Promise.all(data.map(async user => {
                    if (user.userId) {
                        try {
                            const res = await authFetch(`/user/${user.userId}`);
                            if (res.ok) {
                                const userObj = await res.json();
                                loginMap[user.userId] = userObj.login;
                            } else {
                                loginMap[user.userId] = user.userId;
                            }
                        } catch {
                            loginMap[user.userId] = user.userId;
                        }
                    }
                }));
                let table = `<table style='width:100%; background:rgba(255,255,255,0.7); border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.04);'>`;
                table += `<thead><tr><th>Логин</th><th>Win Ratio</th></tr></thead><tbody>`;
                data.forEach((user, idx) => {
                    const login = loginMap[user.userId] ?? user.userId;
                    table += `<tr>` +
                        `<td style='text-align:center; cursor:pointer; color:#2c3e50; text-decoration:underline;' onclick="window.location.href='/ui/user/${user.userId}'">${login}</td>` +
                        `<td style='text-align:center;'>${(user.winRatio * 100).toFixed(1)}%</td>` +
                        `</tr>`;
                });
                table += `</tbody></table>`;
                container.innerHTML = table;
            })
            .catch(() => {
                document.getElementById('leaderboard').innerHTML = '<div class="error-box" style="display:block">Ошибка загрузки таблицы лидеров</div>';
            });
    }

    function goToMyProfile() {
        const userId = sessionStorage.getItem('userId');
        if (userId) {
            window.location.href = '/ui/user/' + userId;
        } else {
            authFetch('/user/me')
                .then(res => res.ok ? res.json() : Promise.reject())
                .then(user => {
                    sessionStorage.setItem('userId', user.id);
                    window.location.href = '/ui/user/' + user.id;
                })
                .catch(() => alert('Ошибка получения профиля пользователя.'));
        }
    }

    loadLeaderboard();
</script>
</body>
</html>
