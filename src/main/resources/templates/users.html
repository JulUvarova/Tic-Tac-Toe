<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список пользователей</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<button class="profile-btn" title="Мой профиль" onclick="goToMyProfile()">
    <span class="profile-icon">👤</span>
</button>
<div class="container">
    <h2>Список пользователей</h2>
    <div class="search-container" style="margin-bottom: 20px;">
        <input
                type="text"
                id="searchInput"
                placeholder="Поиск по логину..."
                style="padding: 8px; width: 200px; margin-right: 10px;"
        >
        <button onclick="searchUsers()" style="padding: 8px 16px;">Поиск</button>
        <button onclick="clearSearch()" style="padding: 8px 16px; margin-left: 5px;">Очистить</button>
    </div>
    <div id="users" class="games-container"></div>
    <div id="pagination" style="margin-top: 15px;"></div>
    <button onclick="window.location.href='/ui/menu'">В меню</button>
</div>
<script src="/js/auth.js"></script>
<script>
    let currentPage = 0;
    const pageSize = 5;  // !!! по 5 на странице

    function loadUsers(page = 0, search = '') { // page = 0 по умолчанию
        let url = `/user?page=${page}&size=${pageSize}`;
        if (search && search.trim() !== '') {
            url += `&search=${encodeURIComponent(search.trim())}`;
        }

        authFetch(url)
            .then(res => res.ok ? res.json() : Promise.reject())
            .then(data => {
                // Ожидается формат { content, totalPages, totalElements, number }
                const usersContainer = document.getElementById('users');
                usersContainer.innerHTML = '';

                const users = data.content || [];
                if (users.length === 0) {
                    const noUsers = document.createElement('div');
                    noUsers.className = 'no-users';
                    noUsers.textContent = 'Нет зарегистрированных пользователей';
                    usersContainer.appendChild(noUsers);
                } else {
                    users.forEach(user => {
                        const userItem = document.createElement('div');
                        userItem.className = 'game-item';
                        userItem.textContent = `${user.login}`;
                        userItem.onclick = () => showUser(user.id);
                        usersContainer.appendChild(userItem);
                    });
                }
                renderPagination(data.totalPages, data.number);
                currentPage = data.number; // Обновляем текущую страницу
            })
            .catch(() => alert('Ошибка загрузки списка пользователей'));
    }

    function searchUsers() {
        const searchValue = document.getElementById('searchInput').value;
        currentSearch = searchValue;
        loadUsers(0, searchValue);
    }

    function clearSearch() {
        document.getElementById('searchInput').value = '';
        currentSearch = '';
        loadUsers(0, '');
    }

    function renderPagination(totalPages, pageNumber) {
        const pagDiv = document.getElementById('pagination');
        pagDiv.innerHTML = ''; // очищаем

        // кнопка назад
        const btnPrev = document.createElement('button');
        btnPrev.textContent = '<';
        btnPrev.disabled = pageNumber <= 0;
        btnPrev.onclick = () => loadUsers(pageNumber - 1);
        pagDiv.appendChild(btnPrev);

        // Страницы
        const span = document.createElement('span');
        span.style.margin = '0 10px';
        span.textContent = `Страница ${pageNumber + 1} из ${totalPages}`;
        pagDiv.appendChild(span);

        // кнопка вперед
        const btnNext = document.createElement('button');
        btnNext.textContent = '>';
        btnNext.disabled = pageNumber >= totalPages - 1;
        btnNext.onclick = () => loadUsers(pageNumber + 1);
        pagDiv.appendChild(btnNext);
    }

    function showUser(userId) {
        authFetch('/user/' + userId, {method: 'GET'})
            .then(res => res.ok ? res.json() : Promise.reject())
            .then(user => window.location.href = '/ui/user/' + user.id)
            .catch(() => alert('Ошибка доступа к карточке игрока'));
    }

    document.addEventListener('DOMContentLoaded', function () {
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchUsers();
            }
        });
    });

    checkAuth();
    loadUsers(0); // загружаем первую страницу

    initProfileMenuHandler();
</script>
</body>
</html>
