<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Крестики-нолики</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Добро пожаловать в игру Крестики-нолики!</h1>
        <img src="/images/welcome.png" alt="Welcome" style="max-width: 300px; display: block; margin: 20px auto;">
        <form id="startForm">
            <button type="submit">Старт</button>
        </form>
    </div>
    <script>
        document.getElementById('startForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const response = await fetch('/game', { method: 'POST' });
            if (response.ok) {
                const game = await response.json();
                window.location.href = '/ui/game/' + game.id;
            } else {
                alert('Ошибка при создании игры');
            }
        });
    </script>
</body>
</html>
